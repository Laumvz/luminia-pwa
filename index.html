
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6d4ca5">
  <meta name="description" content="Agenda personal Luminia 2027">
  <title>Luminia | Agenda 2027</title>

  <link rel="manifest" href="manifest.webmanifest">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(145deg, #eee7fa, #d8c8ef);
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 18px 10px;
      color: #513579;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 2px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 13px;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 95px);
      min-height: 600px;
      border: 0;
      background: white;
    }
  </style>
</head>

<body>
  <header>
    <h1>LUMINIA</h1>
    <p>Tu espacio, tus planes, tus instantes.</p>
  </header>

  <iframe
    src="https://tutuhai.com/embed/apps/st-9ff69d36cf"
    title="Agenda Luminia 2027"
    allow="clipboard-read; clipboard-write"
    loading="eager">
  </iframe>
</body>
</html>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register(
        "/luminia-pwa/service-worker.js"
      ).catch((error) => {
        console.error("Error al activar Luminia:", error);
      });
    });
  }
</script>
</body>
</html>
